name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDKs for mod and tests
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Add Stardew Valley and SMAPI reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Build mod and tests
        run: dotnet build BetaFarmPlanner.sln --configuration Release

      - name: Run unit tests
        run: dotnet test tests/BetaFarmPlanner.Tests/BetaFarmPlanner.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Validate release archive
        run: python3 scripts/validate_release.py

      - name: Upload built mod and attestation
        uses: Pathoschild/SMAPI-ModBuildWorkflow/upload-release-artifacts@v1
        with:
          path: _releases
          create_attestations: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
